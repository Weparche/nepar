name = "nepar-contact"
main = "index.js"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]
# Keep nepar-contact.ig29007.workers.dev alive next to the nepar.hr routes: digitalnicjenik.nepar.hr
# reports checks there and public/nepar-pageview.js (Lime) sends pageviews there.
workers_dev = true

routes = [
  { pattern = "nepar.hr/analytics/*", zone_name = "nepar.hr" },
  # The checker and contact form post same-origin to /api/* (VITE_WORKER_URL=https://nepar.hr).
  { pattern = "nepar.hr/api/*", zone_name = "nepar.hr" }
]

[vars]
KIDS_EMAIL_FROM = "NEPAR Kids <orders@kids.nepar.hr>"

# Secrets:
# wrangler secret put RESEND_API_KEY
# wrangler secret put ADMIN_USER
# wrangler secret put ADMIN_PASS
#
# Create once, then paste the returned id below:
# wrangler kv namespace create ANALYTICS
[[kv_namespaces]]
binding = "ANALYTICS"
id = "018bf45fad444fadbec1a02544a7cbe7"
