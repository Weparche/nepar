name: Digitalni cjenik SEO hotfix

on:
  push:
    paths:
      - .github/workflows/seo-digitalni-cjenik-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused SEO patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/seoConfig.js",
              '  "/digitalni-cjenik": {\n    indexable: true,\n    hr: {\n      title: "Digitalni cjenik XML/CSV od 1.10.2026. | Nepar Solutions",\n      description: "Nova obveza digitalnih cjenika od 1. listopada 2026. Saznajte trebate li XML/CSV cjenik i kako ga implementirati na WordPress, Wix ili postojeću web stranicu.",',
              '  "/digitalni-cjenik": {\n    indexable: true,\n    robots: "index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1",\n    hr: {\n      title: "Digitalni cjenik 2026 – CSV/XML i sidrena cijena | NEPAR",\n      description: "Digitalni cjenik 2026 prema NN 101/2026: CSV/XML, sidrena cijena, 30-dnevna arhiva i automatizirani dohvat. Provjerite obvezu i implementaciju na vašoj web stranici.",'
          )

          replace_once(
              "src/seoConfig.js",
              '        headline: "Digitalni cjenik XML/CSV od 1.10.2026.",\n        description: page.description,\n        mainEntityOfPage: canonicalUrl,',
              '        headline: "Digitalni cjenik 2026 – CSV/XML i sidrena cijena",\n        description: page.description,\n        keywords: ["digitalni cjenik 2026", "sidrena cijena", "CSV cjenik", "XML cjenik", "NN 101/2026", "digitalni cjenik za usluge"],\n        about: [\n          { "@type": "Thing", name: "Digitalni cjenik 2026" },\n          { "@type": "Thing", name: "Sidrena cijena" },\n          { "@type": "Thing", name: "CSV i XML cjenik" },\n        ],\n        mainEntityOfPage: canonicalUrl,'
          )

          replace_once(
              "src/seoConfig.js",
              '        dateModified: "2026-09-15",',
              '        dateModified: "2026-09-16",'
          )

          replace_once(
              "src/DigitalPriceListPage.jsx",
              '    title: "Digitalni cjenik XML/CSV od 1. listopada 2026.",',
              '    title: "Digitalni cjenik 2026: CSV/XML i sidrena cijena",'
          )

          replace_once(
              "src/DigitalPriceListPage.jsx",
              'published: "Objavljeno: 15.09.2026. · Zadnje provjereno prema službenim izvorima: 15.09.2026.",',
              'published: "Objavljeno: 15.09.2026. · Zadnje provjereno prema službenim izvorima: 16.09.2026.",'
          )

          replace_once(
              "src/App.jsx",
              '      cta: "Provjerite svoju web stranicu",',
              '      cta: "Digitalni cjenik 2026 i sidrena cijena",'
          )

          replace_once(
              "vite.config.js",
              'const lastmod = path === "/digitalni-cjenik" ? "<lastmod>2026-09-15</lastmod>" : "";',
              'const lastmod = path === "/digitalni-cjenik" ? "<lastmod>2026-09-16</lastmod>" : "";'
          )

          Path(".github/workflows/seo-digitalni-cjenik-hotfix.yml").unlink()
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/seoConfig.js src/DigitalPriceListPage.jsx src/App.jsx vite.config.js .github/workflows/seo-digitalni-cjenik-hotfix.yml
          git commit -m "fix: strengthen digitalni cjenik search signals"
          git push

# trigger 2026-09-16
