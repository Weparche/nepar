# Nginx snippet for nepar.hr route-specific HTML (e.g. /mozgalica, /kontakt).
# Add inside your nepar.hr server { } block.
# IMPORTANT: do not deploy a physical dist/mozgalica/ directory — it breaks /mozgalica
# (trailing-slash redirects can loop with location = /mozgalica/).

location = /usluge/web-stranica-bez-pocetnog-troska {
    return 301 /usluge/izrada-web-stranica;
}

location / {
    root /var/www/nepar.hr;
    try_files $uri $uri.html $uri/ =404;
}
